version: '3'

services:

  app:
    build: .
    container_name: supermarket_app

    ports:
      - "8080:80"

    depends_on:
      - db

  db:
    image: mariadb:10.5

    container_name: supermarket_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: yes
      MYSQL_DATABASE: shop

